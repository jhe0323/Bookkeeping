# Scientific Monte Carlo parameter specification TEMPLATE.
#
# IMPORTANT:
#   1) The uncertainty widths below are examples only and are DISABLED.
#   2) Replace them with literature/data-supported distributions.
#   3) Enable the parameters you want to sample.
#   4) Set scientific_ranges_confirmed: true only after that review.
#
# The sampler will refuse a production run while the flag is false.

monte_carlo:
  run_config: config/run_mc_1deg.yml
  output: config/mc_samples.parquet
  n_samples: 500
  seed: 20260831
  include_baseline: true
  scientific_ranges_confirmed: false

parameters:
  # Example: one shared multiplier for all natural-vegetation biomass densities.
  # Use scope: independent if each matched PFT/cover should receive its own draw.
  - name: biomass_density_example
    enabled: false
    targets:
      - carbon_density.PFT*.Biomass.v
      - carbon_density.PFT*.Biomass.s
    distribution: lognormal_multiplier
    cv: 0.20                 # EXAMPLE ONLY; replace from evidence
    scope: independent
    value_lower: 0.0

  - name: soil_density_example
    enabled: false
    targets:
      - carbon_density.PFT*.Soil.v
      - carbon_density.PFT*.Soil.s
      - carbon_density.PFT*.Soil.c
      - carbon_density.PFT*.Soil.p
    distribution: lognormal_multiplier
    cv: 0.15                 # EXAMPLE ONLY; replace from evidence
    scope: independent
    value_lower: 0.0

  # Positive response times are naturally suited to multiplicative sampling.
  # Structural zeros remain zero under multiplier sampling.
  - name: clearing_timescale_example
    enabled: false
    targets:
      - clearing_param.PFT*.t_lapse
      - clearing_param.PFT*.t_rest
    distribution: lognormal_multiplier
    cv: 0.20                 # EXAMPLE ONLY
    scope: independent
    value_lower: 0.0

  - name: abandonment_timescale_example
    enabled: false
    targets:
      - abandonment_param.PFT*.t_biomass
      - abandonment_param.PFT*.t_soil
    distribution: lognormal_multiplier
    cv: 0.20                 # EXAMPLE ONLY
    scope: independent
    value_lower: 0.0

  - name: harvest_timescale_example
    enabled: false
    targets:
      - harvest_param.PFT*.t_lapse
    distribution: lognormal_multiplier
    cv: 0.20                 # EXAMPLE ONLY
    scope: independent
    value_lower: 0.0

  # Fractions centered on their baseline values and bounded to [0,1].
  - name: clearing_fast_fraction_example
    enabled: false
    targets:
      - clearing_param.PFT*.f_v
      - clearing_param.PFT*.f_s
    distribution: beta_from_baseline
    concentration: 50        # EXAMPLE ONLY; larger = narrower
    scope: independent
    lower: 0.0
    upper: 1.0

  - name: harvest_soil_fraction_example
    enabled: false
    targets:
      - harvest_param.PFT*.Bio_Soil_v
      - harvest_param.PFT*.Bio_Soil_s
    distribution: beta_from_baseline
    concentration: 50        # EXAMPLE ONLY
    scope: independent
    lower: 0.0
    upper: 1.0

simplex_groups:
  # Dirichlet sampling keeps the allocation sum equal to its baseline total,
  # preventing negative residual atmosphere allocation in clearing.
  - name: clearing_allocation_example
    enabled: false
    parent_pattern: clearing_param.PFT*
    fields: [Prod_1, Prod_10, Prod_100, Bio_Soil]
    concentration: 80        # EXAMPLE ONLY
    preserve_total: true

  # Harvest product fractions are conditional shares of the product pool.
  - name: harvest_product_split_example
    enabled: false
    parent_pattern: harvest_param.PFT*
    fields: [Prod_1, Prod_10, Prod_100]
    concentration: 80        # EXAMPLE ONLY
    preserve_total: true
