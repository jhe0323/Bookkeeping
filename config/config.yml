# Default experiment. Files under config/experiments override this section.
experiment:
  name: harvest_area_driven

harvest:
  mode: area
  demand_source:
    use_bioh: false
  area_constraint:
    use_luh2_harvest_area: true
  allow_expansion:
    enabled: false

#switching between static or dynamic carbon density simulation
dynamic_carbon_density:
  enabled: true # "true" dynamic carbon density; "false" static carbon density
  path: dynamic_carbon_density.parquet
  base_year: 850
  min_year_policy: clip
  max_year_policy: clip
