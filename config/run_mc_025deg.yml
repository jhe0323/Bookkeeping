run:
  name: mc_025deg_static_vscp_v1
  resolution: 025deg
  input_format: vscp
  input_base_year: 850
  start_year: 850
  end_year: 2020
  area_unit: ha

paths:
  data_dir: /home/xibnlkjdxstbckxygcxyuan/jzh0126/LULCC/In_ncfile
  output_dir: /home/xibnlkjdxstbckxygcxyuan/jzh0126/LULCC/Out_ncfile

inputs:
  states: synthetic_states_025deg.nc
  transitions: synthetic_transitions_025deg.nc
  pft: IBIS_PFT_dominant_0.25deg.nc
  pft_variable: null
  time_encoding: index

parameters:
  path: config/config.yml

experiment:
  path: config/experiments/harvest_area.yml

model_overrides:
  dynamic_carbon_density:
    enabled: false

pft:
  base_year: 850
  time_encoding: auto
  update_mode: annual_conservative
  min_year_policy: clip
  max_year_policy: clip
  missing_cell_policy: skip
  nearest_search_radius: 12
  default_index: null

validation:
  run_before_simulation: false
  full_scan: true

output:
  filename_prefix: summary_025deg
  compression_level: 4
  sync_every: 200

server:
  band_size_deg: 3
  stagger_max: 0

monte_carlo:
  name: mc_025deg_static_vscp_v1
  sample_table: config/mc_samples_025deg.parquet
  output_dir: /home/xibnlkjdxstbckxygcxyuan/jzh0126/LULCC/Out_ncfile/MC
  output_variables:
    - Gross_Sources
    - Gross_Sinks
    - Net_Emissions
    - Flux_Clearing
    - Flux_Abandonment
    - Flux_Harvest_Net
    - Flux_Other
    - Flux_Products_Total
    - Flux_FD
    - Flux_NFC
    - Flux_FR
    - Flux_NFR
    - Flux_CAL
    - Flux_WHp
    - Closure_Error
    - Atmosphere_Closure_Error
    - Carbon_Density_Adjustment
    - PFT_Remap_Adjustment
    - biomass_total
    - soil_total
    - P1
    - P10
    - P100
    - atmosphere
    - system_carbon_total
    - area_clearing
    - area_abandonment
    - area_other
    - area_harvest
    - area_deforestation
    - transition_requested_area
    - transition_applied_area
    - transition_clipped_area
    - harvest_luh2_area
    - harvest_effective_area
    - harvest_extra_area

