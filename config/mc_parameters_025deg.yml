# Literature-informed first-production Monte Carlo design.
#
# Scientific design principles
# ----------------------------
# 1) Carbon densities and carbon-allocation rules are treated as the highest
#    priority bookkeeping parameterisation uncertainties.
# 2) Response/recovery times are sampled with moderate uncertainty.
# 3) Natural-vegetation soil density and harvest SOC_min are multiplied by the
#    SAME shared random factor. This preserves the configured physical ratio
#    SOC_min / Soil and prevents sampled SOC_min from exceeding the sampled
#    equilibrium soil density.
# 4) Structural zeros remain zero.
# 5) Beta sampling keeps fractions in [0,1].
# 6) Dirichlet/simplex sampling preserves physically valid allocation totals.
# 7) Use the same priors at 1deg and 0.25deg.
#
# IMPORTANT
# ---------
# The exact CV/concentration values below are WORKING PRIORS. They are not
# probability distributions directly reported by Bastos et al. (2021) or
# Gasser et al. (2020). Keep scientific_ranges_confirmed=false until the
# uncertainty design is explicitly approved.

monte_carlo:
  run_config: config/run_mc_025deg.yml
  output: config/mc_samples_025deg.parquet
  n_samples: 500
  seed: 20260908
  include_baseline: true
  scientific_ranges_confirmed: false

parameters:
  # --------------------------------------------------------------------------
  # A. Carbon densities -- highest priority
  # --------------------------------------------------------------------------

  # Natural vegetation biomass.
  # One shared multiplier preserves relative PFT and v/s contrasts while
  # representing systematic uncertainty in natural biomass stocks.
  - name: biomass_density_natural
    enabled: true
    targets:
      - carbon_density.PFT*.Biomass.v
      - carbon_density.PFT*.Biomass.s
    distribution: lognormal_multiplier
    cv: 0.20
    scope: shared
    value_lower: 0.0

  # Managed-land biomass is sampled independently from natural biomass so the
  # natural-to-managed biomass contrast can vary.
  - name: biomass_density_managed
    enabled: true
    targets:
      - carbon_density.PFT*.Biomass.c
      - carbon_density.PFT*.Biomass.p
    distribution: lognormal_multiplier
    cv: 0.20
    scope: shared
    value_lower: 0.0

  # IMPORTANT:
  # Soil.v/s and harvest SOC_min_v/s MUST share the same multiplier. This keeps
  # SOC_min_v / Soil.v and SOC_min_s / Soil.s unchanged within each realization
  # and prevents a downward soil draw from making SOC_min physically impossible.
  - name: soil_density_natural_and_harvest_floor
    enabled: true
    targets:
      - carbon_density.PFT*.Soil.v
      - carbon_density.PFT*.Soil.s
      - harvest_param.PFT*.SOC_min_v
      - harvest_param.PFT*.SOC_min_s
    distribution: lognormal_multiplier
    cv: 0.15
    scope: shared
    value_lower: 0.0

  - name: soil_density_managed
    enabled: true
    targets:
      - carbon_density.PFT*.Soil.c
      - carbon_density.PFT*.Soil.p
    distribution: lognormal_multiplier
    cv: 0.15
    scope: shared
    value_lower: 0.0

  # --------------------------------------------------------------------------
  # B. Response / recovery times -- secondary priority
  # --------------------------------------------------------------------------

  - name: clearing_response_time
    enabled: true
    targets:
      - clearing_param.PFT*.t_lapse
      - clearing_param.PFT*.t_rest
    distribution: lognormal_multiplier
    cv: 0.25
    scope: shared
    value_lower: 0.0

  - name: abandonment_biomass_time
    enabled: true
    targets:
      - abandonment_param.PFT*.t_biomass
    distribution: lognormal_multiplier
    cv: 0.25
    scope: shared
    value_lower: 0.0

  - name: abandonment_soil_time
    enabled: true
    targets:
      - abandonment_param.PFT*.t_soil
    distribution: lognormal_multiplier
    cv: 0.25
    scope: shared
    value_lower: 0.0

  - name: harvest_response_time
    enabled: true
    targets:
      - harvest_param.PFT*.t_lapse
    distribution: lognormal_multiplier
    cv: 0.25
    scope: shared
    value_lower: 0.0

  # --------------------------------------------------------------------------
  # C. Fractions / fast-slow partitioning
  # --------------------------------------------------------------------------

  - name: clearing_fast_fraction
    enabled: true
    targets:
      - clearing_param.PFT*.f_v
      - clearing_param.PFT*.f_s
    distribution: beta_from_baseline
    concentration: 40
    scope: independent
    lower: 0.0
    upper: 1.0

  - name: harvest_biomass_to_soil_fraction
    enabled: true
    targets:
      - harvest_param.PFT*.Bio_Soil_v
      - harvest_param.PFT*.Bio_Soil_s
    distribution: beta_from_baseline
    concentration: 40
    scope: independent
    lower: 0.0
    upper: 1.0

  - name: harvest_fast_fraction
    enabled: true
    targets:
      - harvest_param.PFT*.f_v
      - harvest_param.PFT*.f_s
    distribution: beta_from_baseline
    concentration: 40
    scope: independent
    lower: 0.0
    upper: 1.0

simplex_groups:
  # --------------------------------------------------------------------------
  # D. Clearing and harvest allocation -- highest priority
  # --------------------------------------------------------------------------

  - name: clearing_allocation
    enabled: true
    parent_pattern: clearing_param.PFT*
    fields: [Prod_1, Prod_10, Prod_100, Bio_Soil]
    concentration: 60
    preserve_total: true

  - name: harvest_product_split
    enabled: true
    parent_pattern: harvest_param.PFT*
    fields: [Prod_1, Prod_10, Prod_100]
    concentration: 60
    preserve_total: true
