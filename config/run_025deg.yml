run:
  name: baseline_025deg_v1
  resolution: 025deg
  input_format: vscp   #vscp or original_luh2
  input_base_year: 850
  start_year: 850
  end_year: 2020
  area_unit: ha

paths:
  data_dir: /home/xibnlkjdxstbckxygcxyuan/jzh0126/LULCC/In_ncfile
  output_dir: /home/xibnlkjdxstbckxygcxyuan/jzh0126/LULCC/Out_ncfile

inputs:
  states: synthetic_states_025deg.nc
  transitions: synthetic_transitions_025deg.nc
  pft: IBIS_PFT_dominant_0.25deg.nc
  pft_variable: null
  time_encoding: index

parameters:
  path: config/config.yml

experiment:
  path: config/experiments/harvest_area.yml

model_overrides:
  dynamic_carbon_density:
    enabled: false

pft:
  base_year: 850
  time_encoding: auto
  update_mode: annual_conservative
  min_year_policy: clip
  max_year_policy: clip
  missing_cell_policy: skip
  nearest_search_radius: 12
  default_index: null

validation:
  run_before_simulation: false
  full_scan: true

output:
  filename_prefix: summary_025deg
  compression_level: 4
  sync_every: 200

server:
  band_size_deg: 3
  stagger_max: 0
